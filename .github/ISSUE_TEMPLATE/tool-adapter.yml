name: Design tool support
description: Request or report on an adapter for a design tool (Penpot, Sketch, Framer, or a new one).
labels: [tool-adapter]
body:
  - type: input
    id: tool
    attributes: { label: Tool, placeholder: "Penpot" }
    validations: { required: true }
  - type: textarea
    id: connection
    attributes: { label: How the agent connects, description: "MCP server or API you use (name and version), and what it can do: read the system, write frames, screenshots, inspect bindings." }
  - type: textarea
    id: details
    attributes: { label: What works, what doesn't, description: For an existing adapter, which steps you tried live and what happened. }
    validations: { required: true }
